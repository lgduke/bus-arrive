<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>내 주변 실시간 버스 v0.7</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
    }
    .spin-anim {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="text-slate-800 pb-12">

  <!-- 상단 헤더 -->
  <header class="bg-blue-600 text-white sticky top-0 z-20 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-1.5">
          <h1 id="headerTitle" class="text-lg font-bold tracking-tight">미아리고개 버스</h1>
          <span class="text-[11px] font-mono font-bold px-1.5 py-0.5 rounded bg-blue-800/70 text-blue-100 border border-blue-400/30">
            v0.7
          </span>
          <span id="statusBadge" class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-blue-500 text-blue-100">
            연결 확인중
          </span>
        </div>
        <p id="currentTime" class="text-xs text-blue-100 mt-0.5">--:--:-- 기준</p>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="refreshBtn" onclick="fetchBusData()" class="p-2 rounded-full hover:bg-blue-500 active:bg-blue-700 transition" title="새로고침">
          <svg id="refreshIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
        <button onclick="toggleSettings()" class="p-2 rounded-full hover:bg-blue-500 active:bg-blue-700 transition" title="연결 설정">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001
